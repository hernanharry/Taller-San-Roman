<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0B0C0E;
    font-family: 'Archivo', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 48px 56px;
    position: relative;
  }
  .glow { position: absolute; top: -180px; right: -120px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(255,61,46,.22) 0%, transparent 65%); }
  .glow2 { position: absolute; bottom: -220px; left: -140px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(245,197,24,.14) 0%, transparent 65%); }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .top img { height: 74px; width: auto; border-radius: 10px; }
  .badge { background: #FF3D2E; color: #fff; font-weight: 800; font-size: 22px; letter-spacing: .18em; padding: 12px 26px; border-radius: 999px; text-transform: uppercase; }
  h1 { font-family: 'Anton', sans-serif; text-transform: uppercase; color: #fff; font-size: 92px; line-height: .95; position: relative; }
  h1 .y { color: #F5C518; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; position: relative; }
  .meta { color: #D4D4D8; font-size: 26px; font-weight: 600; line-height: 1.5; }
  .meta strong { color: #F5C518; }
  .stars { color: #F5C518; font-size: 30px; letter-spacing: 4px; }
  .wa { background: #25D366; color: #fff; font-weight: 800; font-size: 26px; padding: 18px 34px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="top">
    <img src="/img/logo-sanroman.jpg" alt="Taller San Román" />
    <span class="badge">Urgencias 24 hs</span>
  </div>
  <h1>¿Te quedaste en la calle?<br /><span class="y">Solución mecánica en Berisso, ya.</span></h1>
  <div class="bottom">
    <div class="meta">
      <div class="stars">★★★★★ <strong>4.9</strong> en Google</div>
      Presupuesto sin cargo · <strong>+54 9 11 6134-4052</strong>
    </div>
    <span class="wa">Escribinos por WhatsApp</span>
  </div>
</body>
</html>
